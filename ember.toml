[package]
name = "idemandsky/videstate"
version = "0.2.1"
description = "A state handler for Vide that lets you build UI components with states, and change their properties as the state changes."
authors = ["iDemandSky"]
repository = "https://github.com/iDemandSky/VideState"
homepage = "https://idemandsky.github.io/VideState/"
license = "MIT"

[target]
environment = "roblox"
main = "src/init.luau"
includes = [
    "src",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[indices]
Wally = "https://github.com/UpliftGames/wally-index"

[dependencies]
Vide = { name = "centau/vide", version = "0.4.1", index = "Wally" }
Ripple = { name = "littensy/ripple", version = "0.10.2", index = "Wally" }
Typed = { name = "typed/core", version = "^0.9.2" }
TypedCore = { name = "typed/engine", version = "^0.1.0" }

[tools]
larvae = "larvae-luau/larvae@0.11.0"
rojo = "rojo-rbx/rojo@7.7.0"
lest = "lest-luau/lest@0.6.0"

[dev-dependencies]
ui-labs = { name = "pepeeltoro41/ui-labs", version = "2.4.2", index = "Wally" }
